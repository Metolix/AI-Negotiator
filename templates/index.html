<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Police Negotiator Simulator</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #050505;
            color: #ddd;
            font-family:
                "SFMono-Regular",
                Consolas,
                "Liberation Mono",
                monospace;
            min-height: 100vh;
        }

        button,
        input {
            font: inherit;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 24px;
        }

        .terminal {
            border: 1px solid #333;
            background: #080808;
            box-shadow:
                0 0 30px rgba(0, 0, 0, .7);
        }

        .header {
            border-bottom: 1px solid #333;
            padding: 18px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title {
            color: #00d9ff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .online {
            color: #55ff88;
            font-size: 12px;
        }

        .screen {
            padding: 24px;
        }

        .banner {
            color: #00d9ff;
            text-align: center;
            margin-bottom: 30px;
            white-space: pre;
            overflow-x: auto;
        }

        .scenario-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .scenario {
            border: 1px solid #333;
            background: #0b0b0b;
            padding: 20px;
            cursor: pointer;
            transition: .15s;
        }

        .scenario:hover {
            border-color: #00d9ff;
            background: #101010;
        }

        .scenario h3 {
            color: #ff5555;
            margin-top: 0;
        }

        .scenario p {
            color: #888;
            line-height: 1.6;
            font-size: 13px;
        }

        .random {
            margin-top: 20px;
            width: 100%;
        }

        button {
            border: 1px solid #00d9ff;
            background: transparent;
            color: #00d9ff;
            padding: 12px 18px;
            cursor: pointer;
        }

        button:hover {
            background: #00d9ff;
            color: #000;
        }

        .incident {
            color: #ff5555;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .location {
            color: #888;
            margin-bottom: 8px;
        }

        .description {
            color: #aaa;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .opening {
            border-left: 3px solid #ff4444;
            padding: 15px;
            background: #100707;
            margin-bottom: 25px;
        }

        .speaker {
            color: #ff5555;
            font-weight: bold;
        }

        .transcript {
            min-height: 300px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px 0;
        }

        .message {
            margin-bottom: 22px;
            line-height: 1.65;
            white-space: pre-wrap;
        }

        .negotiator {
            color: #00d9ff;
        }

        .hostage {
            color: #ff5555;
        }

        .system {
            color: #777;
            font-size: 13px;
        }

        .status {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 13px 0;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .status-item {
            color: #aaa;
        }

        .status-value {
            color: #00d9ff;
        }

        .demands {
            color: #ffd84d;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            background: #050505;
            border: 1px solid #444;
            color: #eee;
            padding: 15px;
            outline: none;
        }

        #messageInput:focus {
            border-color: #00d9ff;
        }

        #sendButton {
            min-width: 100px;
        }

        .commands {
            color: #555;
            font-size: 12px;
            margin-top: 12px;
        }

        .ending {
            border: 1px solid #555;
            padding: 25px;
            margin-top: 25px;
            text-align: center;
        }

        .ending-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .score {
            font-size: 25px;
            color: #00d9ff;
            margin: 15px;
        }

        .hidden {
            display: none;
        }

        .loading {
            opacity: .5;
            pointer-events: none;
        }

        @media (max-width: 600px) {

            .container {
                padding: 8px;
            }

            .screen {
                padding: 15px;
            }

            .header {
                padding: 13px;
            }

            .input-area {
                flex-direction: column;
            }

            #sendButton {
                width: 100%;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <div class="terminal">

        <div class="header">

            <div class="title">
                POLICE NEGOTIATOR
            </div>

            <div class="online">
                ● SYSTEM ONLINE
            </div>

        </div>

        <!-- Scenario selection -->

        <div id="selectionScreen" class="screen">

            <div class="banner">

╔══════════════════════════════════════════════════════════════╗
║               POLICE NEGOTIATOR SIMULATOR                    ║
╚══════════════════════════════════════════════════════════════╝

            </div>

            <h2>Select Incident</h2>

            <div id="scenarioGrid"
                 class="scenario-grid">
            </div>

            <button class="random"
                    onclick="startRandom()">

                [ R ] RANDOM SCENARIO

            </button>

        </div>


        <!-- Game -->

        <div id="gameScreen"
             class="screen hidden">

            <div id="incident"
                 class="incident">
            </div>

            <div id="location"
                 class="location">
            </div>

            <div id="description"
                 class="description">
            </div>

            <div class="status">

                <div class="status-item">
                    HOSTAGES:
                    <span id="hostages"
                          class="status-value">
                    </span>
                </div>

                <div class="status-item">
                    TURN:
                    <span id="turn"
                          class="status-value">
                    </span>
                </div>

                <div class="status-item">
                    DEMANDS:
                    <span id="demands"
                          class="demands">
                    </span>
                </div>

            </div>

            <div id="transcript"
                 class="transcript">
            </div>

            <div id="ending"
                 class="ending hidden">

                <div id="endingTitle"
                     class="ending-title">
                </div>

                <div id="endingMessage">
                </div>

                <div id="score"
                     class="score">
                </div>

                <button onclick="newOperation()">
                    NEW SCENARIO
                </button>

            </div>

            <div id="inputArea">

                <div class="input-area">

                    <input
                        id="messageInput"
                        type="text"
                        autocomplete="off"
                        placeholder="Enter negotiation message..."
                    >

                    <button id="sendButton"
                            onclick="sendMessage()">

                        SEND

                    </button>

                </div>

                <div class="commands">

                    /status &nbsp; /history

                </div>

            </div>

        </div>

    </div>

</div>


<script>

let game = null;


async function loadScenarios() {

    const response =
        await fetch("/api/scenarios");

    const scenarios =
        await response.json();

    const grid =
        document.getElementById(
            "scenarioGrid"
        );

    grid.innerHTML = "";

    scenarios.forEach(scenario => {

        const card =
            document.createElement("div");

        card.className = "scenario";

        card.innerHTML = `
            <h3>
                [${scenario.id + 1}]
                ${escapeHtml(scenario.name)}
            </h3>

            <p>
                ${escapeHtml(scenario.description)}
            </p>

            <p>
                LOCATION:
                ${escapeHtml(scenario.location)}
            </p>

            <button>
                DEPLOY
            </button>
        `;

        card.addEventListener(
            "click",
            () => startGame(scenario.id)
        );

        grid.appendChild(card);

    });

}


async function startGame(scenario) {

    const response =
        await fetch("/api/new", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                scenario: scenario
            })

        });

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Unable to start game."
        );

        return;

    }

    game = data;

    showGame();

}


async function startRandom() {

    const response =
        await fetch("/api/new", {

            method: "POST",

            headers: {
                "Content-Type":
                    "application/json"
            },

            body: JSON.stringify({
                scenario: "random"
            })

        });

    const data =
        await response.json();

    if (!response.ok) {

        alert(
            data.error ||
            "Unable to start game."
        );

        return;

    }

    game = data;

    showGame();

}


function showGame() {

    document
        .getElementById("selectionScreen")
        .classList.add("hidden");

    document
        .getElementById("gameScreen")
        .classList.remove("hidden");

    const scenario =
        game.scenario;

    document
        .getElementById("incident")
        .textContent =
            "INCIDENT: " +
            scenario.name.toUpperCase();

    document
        .getElementById("location")
        .textContent =
            "Location: " +
            scenario.location;

    document
        .getElementById("description")
        .textContent =
            scenario.description;

    renderTranscript();

    updateStatus();

}


function renderTranscript() {

    const transcript =
        document.getElementById(
            "transcript"
        );

    transcript.innerHTML = "";

    game.history.forEach(item => {

        addMessage(
            item.speaker,
            item.text,
            false
        );

    });

}


function addMessage(
    speaker,
    text,
    scroll = true
) {

    const transcript =
        document.getElementById(
            "transcript"
        );

    const message =
        document.createElement("div");

    message.className =
        "message";

    const speakerClass =
        speaker === "Negotiator"
            ? "negotiator"
            : "hostage";

    message.innerHTML = `
        <span class="${speakerClass}">
            ${escapeHtml(speaker)}:
        </span>
        ${escapeHtml(text)}
    `;

    transcript.appendChild(message);

    if (scroll) {

        transcript.scrollTop =
            transcript.scrollHeight;

    }

}


function updateStatus() {

    const state =
        game.state;

    document
        .getElementById("hostages")
        .textContent =
            `${state.hostages}/${state.initial_hostages}`;

    document
        .getElementById("turn")
        .textContent =
            `${state.turn}/${state.max_turns}`;

    document
        .getElementById("demands")
        .textContent =
            state.demands.length
                ? state.demands.join(", ")
                : "None";

}


async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    const sendButton =
        document.getElementById(
            "sendButton"
        );

    input.value = "";

    sendButton.disabled = true;
    sendButton.textContent = "...";

    addMessage(
        "Negotiator",
        message
    );

    try {

        const response =
            await fetch(
                "/api/message",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        message: message
                    })

                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            addMessage(
                "SYSTEM",
                data.error ||
                "An error occurred."
            );

            return;

        }

        if (data.type === "status") {

            addMessage(
                "COMMANDER",
                JSON.stringify(
                    data.state,
                    null,
                    2
                )
            );

            return;

        }

        if (data.type === "history") {

            renderTranscript();

            return;

        }

        game.state =
            data.state;

        game.history.push({
            speaker:
                game.scenario.character.name,
            text:
                data.dialogue
        });

        addMessage(
            game.scenario.character.name,
            data.dialogue
        );

        updateStatus();

        if (data.ending) {

            showEnding(
                data.ending
            );

        }

    } catch (error) {

        addMessage(
            "SYSTEM",
            "Connection to command server failed."
        );

    } finally {

        sendButton.disabled = false;
        sendButton.textContent = "SEND";

        input.focus();

    }

}


function showEnding(ending) {

    const box =
        document.getElementById(
            "ending"
        );

    box.classList.remove(
        "hidden"
    );

    document
        .getElementById("endingTitle")
        .textContent =
            ending.title;

    document
        .getElementById("endingMessage")
        .textContent =
            ending.message;

    document
        .getElementById("score")
        .textContent =
            `PERFORMANCE RATING: ${ending.score} / 200`;

    document
        .getElementById("inputArea")
        .classList.add("hidden");

}


async function newOperation() {

    await fetch(
        "/api/reset",
        {
            method: "POST"
        }
    );

    location.reload();

}


function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}


document
    .getElementById("messageInput")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter"
                && !event.shiftKey
            ) {

                event.preventDefault();

                sendMessage();

            }

        }
    );


loadScenarios();

</script>

</body>
</html>
